<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pandora Studio</title>
<style>
  :root{
    --bg:#f4f1ed;
    --card:#fffdfb;
    --screen:#f2f0ee;
    --text:#252321;
    --muted:#77716c;
    --border:#d9d3cd;
    --coral:#d88979;
    --purple:#9a86b8;
    --teal:#72aaa2;
    --info-bg:#e9f1f7;
    --info:#416b82;
    --shadow:0 14px 35px rgba(50,42,35,.12);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
  }

  .phone-shell{
    width:min(300px,92vw);
    background:#eee9e4;
    border:1px solid #d9d1ca;
    border-radius:28px;
    padding:14px;
    box-shadow:var(--shadow);
  }

  .phone{
    background:var(--card);
    border:1px solid #e4ded8;
    border-radius:18px;
    overflow:hidden;
  }

  .topbar{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px 8px;
  }

  .time,.dots{font-size:13px;color:var(--muted)}
  .title{font-size:13px;font-weight:600;letter-spacing:-.01em}

  .ar-view{
    position:relative;
    height:230px;
    margin:0 10px;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 38%, rgba(255,255,255,.9), transparent 45%),
      linear-gradient(145deg,#eeeae6,#ded8d2);
  }

  .ar-label{
    position:absolute;
    top:10px;left:10px;
    z-index:10;
    background:rgba(255,253,251,.92);
    border-radius:8px;
    padding:4px 8px;
    font-size:11px;
    font-weight:600;
  }

  .rotate-btn{
    position:absolute;
    right:10px;bottom:10px;
    width:30px;height:30px;
    border:0;
    border-radius:50%;
    background:rgba(255,253,251,.94);
    cursor:pointer;
    font-size:15px;
  }

  .bracelet{
    position:absolute;
    width:150px;height:150px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    transition:transform .45s ease;
  }

  .bracelet-ring{
    position:absolute;
    inset:10px;
    border:7px solid #c7c0ba;
    border-right-color:#e8e3de;
    border-radius:50%;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
  }

  .base-charm{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 2px 5px rgba(0,0,0,.12);
  }
  .base-1{left:50%;top:8%}
  .base-2{left:82%;top:28%}
  .base-3{left:72%;top:79%}
  .base-4{left:28%;top:84%}
  .base-5{left:10%;top:50%}
  .coral{background:var(--coral)}
  .purple{background:var(--purple)}
  .teal{background:var(--teal)}

  #selectedCharms{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .selected-charm{
    position:absolute;
    width:34px;height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:white;
    font-size:16px;
    box-shadow:0 5px 12px rgba(0,0,0,.16);
    animation:pop .24s ease-out;
  }

  .selected-charm span{font-size:16px}
  @keyframes pop{
    from{opacity:0;transform:scale(.55) translateY(5px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }

  .hint{
    position:absolute;
    left:50%;bottom:12px;
    transform:translateX(-50%);
    white-space:nowrap;
    background:rgba(255,253,251,.9);
    color:var(--muted);
    border-radius:8px;
    padding:5px 8px;
    font-size:10px;
    transition:opacity .2s;
  }

  .copy{
    padding:12px 14px 4px;
  }
  .copy p{margin:0}
  .copy .headline{font-size:14px;font-weight:600;margin-bottom:2px}
  .copy .sub{font-size:12px;color:var(--muted)}

  .charm-tray{
    display:flex;
    gap:8px;
    padding:10px 14px;
    overflow-x:auto;
  }

  .charm{
    flex:0 0 auto;
    width:40px;height:40px;
    border-radius:50%;
    border:0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    transition:transform .18s, outline .18s;
  }
  .charm:hover{transform:translateY(-2px)}
  .charm.selected{
    outline:2px solid currentColor;
    outline-offset:2px;
  }

  .add{
    background:transparent;
    border:1px dashed var(--border);
    color:var(--muted);
  }

  .actions{
    display:flex;
    gap:8px;
    padding:10px 14px 12px;
  }

  button{
    font:inherit;
  }

  .action{
    flex:1;
    font-size:12px;
    padding:8px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    transition:transform .15s,background .15s;
  }
  .action:hover{transform:translateY(-1px)}
  .save{
    background:var(--info-bg);
    color:var(--info);
    border-color:transparent;
  }

  .status{
    display:none;
    margin:0 14px 12px;
    padding:9px 10px;
    border-radius:10px;
    background:#f0ece8;
    color:var(--muted);
    font-size:11px;
  }

  .co-panel{
    display:none;
    margin:0 14px 14px;
    padding:12px;
    border-radius:12px;
    background:#f0ece8;
  }
  .co-panel h3{margin:0 0 4px;font-size:12px}
  .co-panel p{margin:0 0 10px;font-size:11px;color:var(--muted);line-height:1.45}
  .co-panel .panel-actions{display:flex;gap:7px}
  .panel-btn{
    flex:1;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:8px;
    padding:7px;
    font-size:11px;
    cursor:pointer;
  }

  @media(max-width:340px){
    .phone-shell{padding:10px}
  }
</style>
</head>

<body>
<div class="phone-shell">
  <div class="phone">

    <div class="topbar">
      <span class="time">9:41</span>
      <span class="title">My Pandora Studio</span>
      <span class="dots">•••</span>
    </div>

    <div class="ar-view">
      <div class="ar-label">✦ AR live view</div>

      <div class="bracelet" id="bracelet">
        <div class="bracelet-ring"></div>
        <div class="base-charm coral base-1"></div>
        <div class="base-charm purple base-2"></div>
        <div class="base-charm teal base-3"></div>
        <div class="base-charm coral base-4"></div>
        <div class="base-charm purple base-5"></div>
        <div id="selectedCharms"></div>
      </div>

      <div class="hint" id="hint">Tap a charm to customise your look</div>

      <button class="rotate-btn" id="rotateBtn" aria-label="Rotate bracelet">↻</button>
    </div>

    <div class="copy">
      <p class="headline">Design With &amp; By You</p>
      <p class="sub">Mix charms in AR, share for community votes</p>
    </div>

    <div class="charm-tray">
      <button class="charm coral" data-charm="flower" aria-label="Add flower charm">✿</button>
      <button class="charm purple" data-charm="star" aria-label="Add star charm">★</button>
      <button class="charm teal" data-charm="leaf" aria-label="Add leaf charm">⌁</button>
      <button class="charm add" id="addCharm" aria-label="Add another charm">＋</button>
    </div>

    <div class="actions">
      <button class="action" id="coCreateBtn">♧ &nbsp;Co-create</button>
      <button class="action save" id="saveBtn">Save look</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="co-panel" id="coPanel">
      <h3>Community co-creation</h3>
      <p>Share this look with the Pandora community and invite people to vote on the combination.</p>
      <div class="panel-actions">
        <button class="panel-btn" id="voteBtn">♡ Vote on this look</button>
        <button class="panel-btn" id="closeBtn">Close</button>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const definitions = {
    flower:{symbol:"✿", className:"coral", label:"Flower charm"},
    star:{symbol:"★", className:"purple", label:"Star charm"},
    leaf:{symbol:"⌁", className:"teal", label:"Leaf charm"}
  };

  const positions = [
    {left:"50%",top:"8%"},
    {left:"78%",top:"28%"},
    {left:"71%",top:"75%"},
    {left:"29%",top:"82%"},
    {left:"10%",top:"50%"}
  ];

  const selected = [];
  const selectedCharms = document.getElementById("selectedCharms");
  const hint = document.getElementById("hint");
  const status = document.getElementById("status");
  const bracelet = document.getElementById("bracelet");
  const coPanel = document.getElementById("coPanel");

  function message(text){
    status.textContent = text;
    status.style.display = "block";
    clearTimeout(window._statusTimer);
    window._statusTimer = setTimeout(()=>{
      status.style.display = "none";
    },2200);
  }

  function render(){
    selectedCharms.innerHTML = "";

    selected.forEach((key,index)=>{
      const d = definitions[key];
      const el = document.createElement("div");
      el.className = "selected-charm " + d.className;
      el.style.left = positions[index % positions.length].left;
      el.style.top = positions[index % positions.length].top;
      el.innerHTML = "<span>"+d.symbol+"</span>";
      selectedCharms.appendChild(el);
    });

    hint.style.opacity = selected.length ? "0" : "1";

    document.querySelectorAll(".charm[data-charm]").forEach(btn=>{
      btn.classList.toggle("selected", selected.includes(btn.dataset.charm));
    });
  }

  document.querySelectorAll(".charm[data-charm]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const key = btn.dataset.charm;
      const index = selected.indexOf(key);

      if(index >= 0){
        selected.splice(index,1);
        message(definitions[key].label + " removed");
      }else{
        selected.push(key);
        message(definitions[key].label + " added to your look");
      }
      render();
    });
  });

  document.getElementById("addCharm").addEventListener("click",()=>{
    const next = Object.keys(definitions).find(key=>!selected.includes(key));
    if(next){
      selected.push(next);
      message(definitions[next].label + " added to your look");
      render();
    }else{
      message("All available charms are already selected");
    }
  });

  document.getElementById("saveBtn").addEventListener("click",function(){
    if(!selected.length){
      message("Add at least one charm before saving");
      return;
    }

    localStorage.setItem("myPandoraLook",JSON.stringify(selected));
    const original = this.textContent;
    this.textContent = "✓ Saved";
    message("Your look has been saved");
    setTimeout(()=>this.textContent=original,1600);
  });

  document.getElementById("coCreateBtn").addEventListener("click",()=>{
    coPanel.style.display = coPanel.style.display === "block" ? "none" : "block";
  });

  document.getElementById("closeBtn").addEventListener("click",()=>{
    coPanel.style.display = "none";
  });

  document.getElementById("voteBtn").addEventListener("click",function(){
    this.textContent = "✓ Vote recorded";
    message("Thanks — your community vote is in");
  });

  document.getElementById("rotateBtn").addEventListener("click",()=>{
    bracelet.style.transform =
      bracelet.style.transform === "translate(-50%,-50%) rotate(180deg)"
      ? "translate(-50%,-50%)"
      : "translate(-50%,-50%) rotate(180deg)";
  });

  // Restore a previously saved look if available.
  try{
    const saved = JSON.parse(localStorage.getItem("myPandoraLook") || "[]");
    if(Array.isArray(saved)){
      saved.filter(k=>definitions[k]).forEach(k=>selected.push(k));
    }
  }catch(e){}

  render();
})();
</script>
</body>
</html>
