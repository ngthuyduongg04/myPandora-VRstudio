<div style="display:flex; justify-content:center; padding:1rem 0;">
<div style="width:300px; background:var(--color-background-secondary); border-radius:28px; padding:14px; border:0.5px solid var(--color-border-tertiary);">
  <div style="background:var(--color-background-primary); border-radius:18px; overflow:hidden; border:0.5px solid var(--color-border-tertiary);">

    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px;">
      <span style="font-size:13px; font-weight:500; color:var(--color-text-secondary);">9:41</span>
      <span style="font-size:13px; font-weight:500;">My Pandora Studio</span>
      <i class="ti ti-dots" style="font-size:16px; color:var(--color-text-secondary);" aria-hidden="true"></i>
    </div>

    <div style="position:relative; height:230px; background:var(--color-background-tertiary); margin:0 10px; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="46" fill="none" stroke="var(--color-border-secondary)" stroke-width="6"/>
        <circle cx="60" cy="20" r="9" class="c-coral" fill="currentColor"/>
        <circle cx="98" cy="48" r="7" class="c-purple" fill="currentColor"/>
        <circle cx="86" cy="92" r="8" class="c-teal" fill="currentColor"/>
        <circle cx="38" cy="98" r="6" class="c-coral" fill="currentColor"/>
        <circle cx="14" cy="60" r="7" class="c-purple" fill="currentColor"/>
      </svg>
      <div style="position:absolute; top:10px; left:10px; background:var(--color-background-primary); border-radius:var(--border-radius-md); padding:3px 8px; font-size:11px; font-weight:500; display:flex; align-items:center; gap:4px;"><i class="ti ti-augmented-reality" style="font-size:14px;" aria-hidden="true"></i>AR live view</div>
      <div style="position:absolute; bottom:10px; right:10px; background:var(--color-background-primary); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-rotate-3d" style="font-size:16px;" aria-hidden="true"></i></div>
    </div>

    <div style="padding:12px 14px 4px;">
      <p style="font-size:14px; font-weight:500; margin:0 0 2px;">Design With &amp; By You</p>
      <p style="font-size:12px; color:var(--color-text-secondary); margin:0;">Mix charms in AR, share for community votes</p>
    </div>

    <div style="display:flex; gap:8px; padding:10px 14px; overflow-x:auto;">
      <div class="c-coral" style="flex:0 0 auto; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="ti ti-flower" style="font-size:18px;" aria-hidden="true"></i></div>
      <div class="c-purple" style="flex:0 0 auto; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="ti ti-star" style="font-size:18px;" aria-hidden="true"></i></div>
      <div class="c-teal" style="flex:0 0 auto; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="ti ti-leaf" style="font-size:18px;" aria-hidden="true"></i></div>
      <div style="flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px dashed var(--color-border-secondary); display:flex; align-items:center; justify-content:center;"><i class="ti ti-plus" style="font-size:16px; color:var(--color-text-secondary);" aria-hidden="true"></i></div>
    </div>

    <div style="display:flex; gap:8px; padding:10px 14px 16px;">
      <button style="flex:1; font-size:12px; padding:8px;"><i class="ti ti-users" style="font-size:14px; vertical-align:-2px;" aria-hidden="true"></i> Co-create</button>
      <button style="flex:1; font-size:12px; padding:8px; background:var(--color-background-info); color:var(--color-text-info); border-color:transparent;">Save look</button>
    </div>
  </div>
</div>
</div>
